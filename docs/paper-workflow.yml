# Hourly paper trading (simulation only: no orders are sent anywhere).
# Runs at minute 7 of every hour, Sunday-Friday UTC, and on demand from the Actions tab.
# Optional secret TWELVEDATA_API_KEY: real XAU/USD spot bars instead of the GC=F futures proxy.
name: paper-trader

on:
  schedule:
    - cron: "7 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore macro data
        uses: actions/cache@v4
        with:
          path: data/processed/macro_daily.parquet
          key: macro-${{ github.run_id }}
          restore-keys: macro-

      - name: Paper trading cycle
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: .venv/bin/python scripts/paper.py run "github-actions"

      - name: Commit journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/paper.sql reports/paper_report.md data/live
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "paper: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
